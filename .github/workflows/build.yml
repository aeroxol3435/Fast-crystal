name: Build Fast Crystal EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # 🔥 THIS FIXES YOUR ERROR

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name "Fast Crystal" main.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Fast Crystal v1.0
          files: dist/*.exe
