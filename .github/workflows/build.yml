name: Build & Release Fast Crystal

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install PyInstaller
        run: pip install pyinstaller

      - name: 🛠️ Build EXE
        run: pyinstaller --onefile --noconsole --name "Fast Crystal" main.py

      - name: 📁 Rename EXE
        run: move "dist\\Fast Crystal.exe" "dist\\Fast-Crystal.exe"

      - name: 🚀 Create Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fast Crystal Build v1.0.${{ github.run_number }}
          files: dist/Fast-Crystal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
