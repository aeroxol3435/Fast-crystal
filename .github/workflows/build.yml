name: Build Fast Crystal EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if exist requirements.txt pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name "Fast Crystal" --icon=app.ico main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Crystal-EXE
          path: dist/*.exe
